<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <nav class="navbar">
        <ul>
          <a href="index.html"><img src="mainlogo-removebg-preview.png" /></a>
          <li><a href="index.html">Home</a></li>
          <li><a href="restaurant.html">Restaurants</a></li>
          <li><a href="categories.html">Categories</a></li>
          <li><a href="map.html ">Map</a></li>
          <li><a href="aboutus.html">About Us</a></li>
          <li><input type="search" placeholder="Search Restraunts" /></li>
        </ul>
      </nav>

      <div class="signup-container">
        <!-- left -->
        <div class="sc-image-section">
          <img src="rescover.jfif" alt="Restaurant" />
          <div>
            <h2>Welcome!</h2>
            <p>Signup to discover amazing restaurants.</p>
          </div>
        </div>

        <!-- Right -->
        <div class="sc-form-section">
          <h2>Sign Up</h2>
          <p>
            Already have an account?
            <a href="login.html">Log in</a>
          </p>

          <label for="username">Username</label>
          <input type="text" placeholder="Enter your name" id="username" />

          <label for="useremail">Email</label>
          <input type="email" placeholder="Enter your email" id="useremail" />

          <label for="userpassword">Password</label>
          <input type="password" placeholder="Enter your password" id="userpassword"/>

          <label for="cpassword">Password</label>
          <input type="password" placeholder="Confirm your password" id="cpassword"/>

          <button>Signup</button>

          <p>or continue with</p>

          <button>Google</button>
          <button>Facebook</button>
        </div>
      </div>
    </div>
  </body>
</html>
